<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="edustream">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>edustream</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.addEventListener('load', function() {
      if (typeof Razorpay !== 'undefined') {
        console.log('RAZORPAY_LOG: Razorpay SDK loaded successfully');
      } else {
        console.error('RAZORPAY_LOG: Razorpay SDK failed to load');
      }
    });

    window.RazorpayOpen = function(options) {
      console.log('RAZORPAY_LOG: Opening Razorpay with options:', options);
      
      options.handler = function(response) {
        console.log('RAZORPAY_LOG: Payment Success:', response);
        // Call Flutter's registered handler if available
        if (typeof window.handleRazorpaySuccess === 'function') {
          window.handleRazorpaySuccess(
            response.razorpay_payment_id,
            response.razorpay_order_id,
            response.razorpay_signature
          );
        } else {
          // Fallback: dispatch event
          window.dispatchEvent(new CustomEvent('razorpay_success', { detail: response }));
        }
      };

      options.modal = {
        ondismiss: function() {
          console.log('RAZORPAY_LOG: Payment Modal Dismissed');
          window.dispatchEvent(new CustomEvent('razorpay_dismissed'));
        }
      };

      try {
        var rzp = new Razorpay(options);
        rzp.open();
      } catch (e) {
        console.error('RAZORPAY_LOG: Razorpay initialization failed:', e);
      }
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
